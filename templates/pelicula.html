<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ pelicula["titulo"] }} | Mi catálogo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: white;
        }

        /* NAVEGACIÓN */

        nav {
            width: 100%;
            padding: 18px 5%;
            background-color: #181818;
            border-bottom: 1px solid #292929;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .inicio {
            color: #bbbbbb;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.2s ease;
        }

        .inicio:hover {
            color: white;
        }

        /* CONTENEDOR */

        .contenedor {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        /* BOTÓN VOLVER */

        .volver {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 16px;
            background-color: #252525;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .volver:hover {
            background-color: #333333;
            transform: translateX(-3px);
        }

        /* INFORMACIÓN DE LA PELÍCULA */

        .pelicula-detalle {
            display: flex;
            gap: 40px;
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 15px;
        }

        .poster {
            width: 300px;
            min-width: 300px;
            height: 430px;
            overflow: hidden;
            border-radius: 10px;
        }

        .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .informacion {
            padding: 10px 0;
        }

        h1 {
            font-size: 38px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .genero {
            color: #bbbbbb;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .sinopsis {
            color: #cccccc;
            font-size: 17px;
            line-height: 1.7;
        }

        /* TRÁILER */

        .trailer {
            margin-top: 40px;
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 15px;
        }

        .trailer h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .video {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
        }

        .video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* CELULAR */

        @media (max-width: 700px) {

            nav {
                padding: 15px 5%;
            }

            .logo {
                font-size: 17px;
            }

            .inicio {
                font-size: 14px;
            }

            .pelicula-detalle {
                flex-direction: column;
                padding: 20px;
            }

            .poster {
                width: 100%;
                min-width: auto;
                height: 400px;
            }

            h1 {
                font-size: 30px;
            }

            .trailer {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

    <!-- NAVEGACIÓN -->

    <nav>

        <a href="{{ url_for('inicio') }}" class="logo">
            🎬 Mi catálogo
        </a>

        <a href="{{ url_for('inicio') }}" class="inicio">
            Inicio
        </a>

    </nav>


    <div class="contenedor">

        <!-- BOTÓN VOLVER -->

        <a href="{{ url_for('inicio') }}" class="volver">
            ← Volver al catálogo
        </a>


        <!-- INFORMACIÓN -->

        <div class="pelicula-detalle">

            <div class="poster">

                <img
                    src="{{ url_for('static', filename=pelicula['imagen']) }}"
                    alt="{{ pelicula['titulo'] }}"
                >

            </div>


            <div class="informacion">

                <h1>{{ pelicula["titulo"] }}</h1>

                <p class="genero">
                    🎭 {{ pelicula["genero"] }} · {{ pelicula["año"] }}
                </p>

                <p class="sinopsis">
                    {{ pelicula["sinopsis"] }}
                </p>

            </div>

        </div>


        <!-- TRÁILER -->

        <div class="trailer">

            <h2>▶️ Tráiler</h2>

            <div class="video">

                <iframe
                    src="{{ pelicula['trailer'].replace('watch?v=', 'embed/') }}"
                    title="Tráiler de {{ pelicula['titulo'] }}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

    </div>

</body>

</html>
